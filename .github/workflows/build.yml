name: Build & release APK

on:
  push:
    branches: [main]
  # PRs get the same tests + build, so breakage is caught before merging.
  pull_request:
  workflow_dispatch:

# A newer push to the same PR makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Pinned: `ubuntu-latest` moves to a new Ubuntu on GitHub's schedule, which
    # can break the Android SDK setup without any change on our side.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: Google removed the legacy
          # `tools` package from the SDK repository. We only need platform-tools.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Validate training dataset
        run: |
          python3 training/generate_dataset.py
          python3 training/validate_dataset.py

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep the APK for the release job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quiver-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release:
    # Only merges to main publish; PRs never get write access.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quiver-apk

      - name: Stage APK
        run: mv app-debug.apk Quiver.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Quiver build ${{ github.run_number }}
          files: Quiver.apk
          generate_release_notes: true
